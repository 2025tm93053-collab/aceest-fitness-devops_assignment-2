apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness
spec:
  replicas: 1
  selector:
    matchLabels: {app: aceest-fitness, colour: blue}
  template:
    metadata:
      labels: {app: aceest-fitness, colour: blue}
    spec:
      containers:
      - name: app
        image: aceest-fitness:3.0.0
        ports: [{containerPort: 8000}]
        env:
        - name: DEPLOY_COLOR
          value: blue
        - name: VARIANT
          value: A
        readinessProbe:
          httpGet: {path: /health, port: 8000}
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-fitness
spec:
  selector: {app: aceest-fitness, colour: blue}
  ports:
  - port: 80
    targetPort: 8000
