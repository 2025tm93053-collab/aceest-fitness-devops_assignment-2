# SonarQube analysis for the ACEest Flask application (Python).
sonar.projectKey=aceest-fitness
sonar.projectName=ACEest Fitness & Gym
sonar.sourceEncoding=UTF-8

sonar.sources=app
sonar.tests=tests
sonar.python.version=3.12

# Produced by pytest-cov (see pytest.ini / .coveragerc): paths are relative, e.g. app/db.py
sonar.python.coverage.reportPaths=coverage.xml

sonar.exclusions=app/static/**,app/templates/**
sonar.coverage.exclusions=tests/**,wsgi.py
